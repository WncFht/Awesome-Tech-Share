version: 1
status: active
principles:
  - 以资源的主要技术主题或主要用途归类，不以网站、作者、工具品牌作为同级分类。
  - 顶层分类控制在五个稳定主题域；站点首页、标签和贡献者属于功能页，不计入内容分类。
  - 子分类最多两级；不足以可靠判断的记录保留原位置并标记人工确认。
  - 重复、失效或受限链接不直接删除，必须在调整清单中保留来源和回滚信息。

